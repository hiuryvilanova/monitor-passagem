name: Monitor de passagens

# O seu computador faz a busca toda hora e envia o painel (mais preciso: o Google mostra
# todos os voos para quem está no Brasil). Este workflow:
#  - publica o painel sempre que o computador envia uma atualização (push em docs/);
#  - aos :30 de cada hora, faz a busca ele mesmo se o painel estiver há mais de 50 min
#    sem atualizar (computador desligado), para o painel nunca ficar parado.
on:
  schedule:
    - cron: "30 * * * *"
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:       # botão "Run workflow": busca na hora, mesmo com dados recentes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.11"
          cache: pip

      - if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Buscar preços e gerar painel
        if: github.event_name != 'push'
        run: python painel.py ${{ github.event_name == 'schedule' && '--se-desatualizado 50' || '' }}
        env:
          ORIGEM_BUSCA: github
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Salvar histórico no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dados
          git diff --cached --quiet || git commit -m "Atualiza preços (GitHub) $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
